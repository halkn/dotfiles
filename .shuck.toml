# A project config does not inherit ~/.config/shuck/shuck.toml, so the Google Shell Style
# baseline is repeated here to keep the repo-specific rules below active in CLI and LSP alike.

[lint]
select = ["google"]
per-file-ignores = { ".config/zsh/.zshenv" = ["S017"] }

# A reserved variable that zsh's compinit reads at startup, invisible to a static source graph.
[[lint.contracts.custom]]
id = "zsh-compinit"
when = "always"
files = [".config/zsh/.zshenv"]

[lint.contracts.custom.consumes]
names = ["skip_global_compinit"]

[format]
indent-style = "space"
indent-width = 2
binary-next-line = true
switch-case-indent = true

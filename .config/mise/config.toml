[settings]
# [dotfiles] symlinks this file to ~/.config/mise/config.toml, so everything here applies to
# every project on the machine, not just this repository.
# No `lockfile` key on purpose. The tools below are declared, not pinned: every machine resolves
# them at install time. Leaving it unset rather than `false` keeps mise honouring the lockfiles
# other repositories on this machine commit.
#
# With no lockfile to exempt the versions, this filter is what every install of the tools below
# passes through. Long enough for a compromised release to be yanked upstream first; tools
# published from this account opt out per tool.
minimum_release_age = "3d"

[tools]
# dev
uv = "latest"
node = "latest"
go = "latest"

# terminal
starship = "latest"
herdr = "latest"

# cli
ripgrep = "latest"
ast-grep = "latest"
fd = "latest"
fzf = "latest"
# Stays on the asdf plugin: the aqua registry builds eza from source on macos-arm64.
eza = "latest"
jq = "latest"
yq = "latest"
"github:halkn/docsail" = { version = "latest", minimum_release_age = "0s" }
"github:halkn/mdiv" = { version = "latest", minimum_release_age = "0s" }
"github:halkn/mdvu" = { version = "latest", minimum_release_age = "0s" }

# vcs
gh = "latest"
hunk = "latest"
"github:halkn/git-fz" = { version = "latest", minimum_release_age = "0s" }

# editor
neovim = "stable"
tree-sitter = "latest"

# LSP / Linter / Formatter
# Passing uvx_args selects uv's version-only install path, which lets uv pick its own
# interpreter; graph locking would instead require a mise-managed python. The value is uv's
# default, so it changes nothing else.
"pypi:ryl" = { version = "latest", uvx_args = "--resolution highest" }
"pypi:shuck-cli" = { version = "latest", uvx_args = "--resolution highest" }
rumdl = "latest"
"go:golang.org/x/tools/gopls" = "latest"
# No yaml language server here: ryl covers both lint and format.

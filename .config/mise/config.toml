[settings]
# [dotfiles] symlinks this file to ~/.config/mise/config.toml, so everything here applies to
# every project on the machine, not just this repository. `lockfile` is left unset rather than
# `false` for that reason: `false` would stop mise reading the lockfiles other repositories commit.
# Long enough for a compromised release to be yanked upstream first; tools published from this
# account opt out per tool.
minimum_release_age = "3d"

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[tools]
# dev
uv = "latest"
bun = "latest"
go = "latest"

# terminal
starship = "latest"
herdr = "latest"

# cli
ripgrep = "latest"
ast-grep = "latest"
fd = "latest"
fzf = "latest"
eza = "latest"
jq = "latest"
yq = "latest"
"github:halkn/mdvu" = { version = "latest", minimum_release_age = "0s" }

# vcs
gh = "latest"
delta = "latest"
"github:halkn/git-fz" = { version = "latest", minimum_release_age = "0s" }

# editor
"aqua:neovim/neovim" = "latest"
tree-sitter = "latest"

# LSP / Linter / Formatter
"aqua:owenlamont/ryl" = "latest"
"github:ewhauser/shuck" = "latest"
rumdl = "latest"
"go:golang.org/x/tools/gopls" = "latest"
stylua = "latest"
jactionlint = "latest"
# No yaml language server here: ryl covers both lint and format.

[tool_alias]
emmylua_ls = "github:EmmyLuaLs/emmylua-analyzer-rust"
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools.emmylua_ls]
version = "latest"
matching = "emmylua_ls"
rename_exe = "emmylua_ls"

[tools.emmylua_check]
version = "latest"
matching = "emmylua_check"
rename_exe = "emmylua_check"

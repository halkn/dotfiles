[settings]
# [dotfiles] symlinks this file to ~/.config/mise/config.toml, so everything here applies to
# every project on the machine, not just this repository.
lockfile = true
# Releases younger than this are not selectable, leaving a window in which a compromised release
# can be yanked upstream before any machine picks it up. Tools published from this account opt
# out per tool below, because their releases are made here and need no such window.
minimum_release_age = "3d"
# The machines this repository is deployed on: Apple Silicon macOS and WSL. Without this, locking
# targets every common platform, so the lockfiles carry entries no machine here ever installs.
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
# dev
uv = "latest"
node = "latest"

# terminal
starship = "latest"
herdr = "latest"

# cli
ripgrep = "latest"
ast-grep = "latest"
fd = "latest"
fzf = "latest"
eza = "latest"
jq = "latest"
yq = "latest"
"github:halkn/docsail" = { version = "latest", minimum_release_age = "0s" }
"github:halkn/mdiv" = { version = "latest", minimum_release_age = "0s" }
"github:halkn/mdvu" = { version = "latest", minimum_release_age = "0s" }

# vcs
gh = "latest"
delta = "latest"

# editor
neovim = "stable"
tree-sitter = "latest"

# LSP / Linter / Formatter
"pipx:ryl" = "latest"
"pipx:shuck-cli" = "latest"
rumdl = "latest"
# No yaml language server here: ryl covers both lint and format.

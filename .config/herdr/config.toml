onboarding = false
# Defaults: `herdr --default-config` / apply changes: `herdr server reload-config`

[experimental]
kitty_graphics = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
switch_ascii_input_source_in_prefix = true

# ── Terminal ─────────────────────────────────────────
[terminal]
new_cwd = "follow"

# ── Theme ────────────────────────────────────────────
[theme]
name = "terminal"

# ── UI ───────────────────────────────────────────────
[ui]
mouse_capture = true
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.toast]
delivery = "system"
delay_seconds = 3

# ── Worktrees ────────────────────────────────────────
# Moved out of the default ~/.herdr/worktrees to follow XDG. A worktree can hold uncommitted
# work, so it belongs under data rather than cache or state. `wt` reads this value to decide
# its own fallback path, which makes this line the single source of truth for the location.
[worktrees]
directory = "~/.local/share/herdr/worktrees"

# ── Session ──────────────────────────────────────────
[session]
resume_agents_on_restore = true

# ── Keybindings ──────────────────────────────────────
[keys]
prefix = "ctrl+space"
# alt+w is given to the popup below, which picks a repository first; the built-in that
# creates a workspace straight from the current cwd moves to alt+shift+w.
new_workspace = "alt+shift+w"
new_worktree = "alt+g"
split_vertical = "alt+;"
split_horizontal = "alt+minus"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

[[keys.command]]
key = "alt+left"
type = "shell"
command = "herdr pane focus --direction left"

[[keys.command]]
key = "alt+down"
type = "shell"
command = "herdr pane focus --direction down"

[[keys.command]]
key = "alt+up"
type = "shell"
command = "herdr pane focus --direction up"

[[keys.command]]
key = "alt+right"
type = "shell"
command = "herdr pane focus --direction right"

[[keys.command]]
key = "alt+plus"
type = "shell"
command = "herdr pane split --direction right --ratio 0.3 --focus"

[[keys.command]]
key = "alt+w"
type = "popup"
command = "~/.config/herdr/herdr-repo-workspace.sh"
description = "new workspace from a repository"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+s"
type = "popup"
command = "~/.config/herdr/herdr-picker.sh"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"

onboarding = false
# Defaults: `herdr --default-config` / apply changes: `herdr server reload-config`

[experimental]
kitty_graphics = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
switch_ascii_input_source_in_prefix = true

# ── Terminal ─────────────────────────────────────────
[terminal]
new_cwd = "follow"

# ── Theme ────────────────────────────────────────────
[theme]
name = "terminal"

# ── UI ───────────────────────────────────────────────
[ui]
mouse_capture = true
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.toast]
delivery = "system"
delay_seconds = 3

# ── Worktrees ────────────────────────────────────────
# Moved out of the default ~/.herdr/worktrees to follow XDG. A worktree can hold uncommitted
# work, so it belongs under data rather than cache or state. `$WT_ROOT` (.config/zsh/.zshenv)
# holds the same path: herdr and `wk` place worktrees in one tree, so the two move together.
[worktrees]
directory = "~/.local/share/herdr/worktrees"

# ── Session ──────────────────────────────────────────
[session]
resume_agents_on_restore = true

# ── Keybindings ──────────────────────────────────────
[keys]
prefix = "ctrl+space"
# The default is the chord prefix+shift+n (herdr 0.8.2); alt+w keeps "a workspace on
# the current directory" one key away, next to alt+s which goes to an existing one.
new_workspace = "alt+w"
split_vertical = "alt+;"
split_horizontal = "alt+minus"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

[[keys.command]]
key = "alt+left"
type = "shell"
command = "herdr pane focus --direction left"

[[keys.command]]
key = "alt+down"
type = "shell"
command = "herdr pane focus --direction down"

[[keys.command]]
key = "alt+up"
type = "shell"
command = "herdr pane focus --direction up"

[[keys.command]]
key = "alt+right"
type = "shell"
command = "herdr pane focus --direction right"

[[keys.command]]
key = "alt+plus"
type = "shell"
command = "herdr pane split --direction right --ratio 0.3 --focus"

[[keys.command]]
key = "alt+s"
type = "popup"
command = "~/.config/herdr/herdr-picker.sh"
description = "go to a workspace or a worktree"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+n"
type = "popup"
command = "~/.config/herdr/herdr-open.sh"
description = "open a workspace on a repository or a place"
width = "90%"
height = "90%"

# `wk new` rather than herdr's own new_worktree, which is left on its default chord: the
# branch has to be picked up where it already is (locally, then on origin) before a new one
# is created, and that decision lives in .config/zsh/workflows/wk.zsh.
[[keys.command]]
key = "alt+g"
type = "popup"
command = "~/.config/herdr/herdr-new.sh"
description = "create the worktree for a branch and open it"
width = "60%"
height = "20%"

[[keys.command]]
key = "alt+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"

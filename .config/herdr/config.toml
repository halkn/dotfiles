onboarding = false
# Defaults: `herdr --default-config` / apply changes: `herdr server reload-config`
# Only values that differ from the defaults are set, so a changed default applies on upgrade.
# Guards against losing work are the exception and stay pinned even when they match the default.

[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
switch_ascii_input_source_in_prefix = true

# ── Theme ────────────────────────────────────────────
[theme]
name = "terminal"

# ── UI ───────────────────────────────────────────────
[ui]
confirm_close = true
prompt_new_tab_name = false
pane_gaps = false
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.toast]
delivery = "system"
delay_seconds = 3

# ── Worktrees ────────────────────────────────────────
# Moved out of the default ~/.herdr/worktrees to follow XDG. A worktree can hold uncommitted
# work, so it belongs under data rather than cache or state, and it outlives herdr, so it is
# not under a herdr-owned directory. `$WT_ROOT` (.config/zsh/.zshenv) holds the same path:
# herdr and `hw` place worktrees in one tree, so the two move together.
[worktrees]
directory = "~/.local/share/worktrees"

# ── Keybindings ──────────────────────────────────────
[keys]
prefix = "ctrl+space"
# The default is the chord prefix+shift+n (herdr 0.9.5); alt+w keeps "a workspace on
# the current directory" one key away, next to alt+n which opens one on a clone.
new_workspace = "alt+w"
split_vertical = "alt+;"
split_horizontal = "alt+minus"
# No alt+left / alt+right: Ghostty binds them to word motion by default, so they never reach herdr.
focus_pane_left = "alt+h"
focus_pane_down = ["alt+j", "alt+down"]
focus_pane_up = ["alt+k", "alt+up"]
focus_pane_right = "alt+l"
# Going to a workspace on one key, beside alt+n / alt+g / alt+p which open one.
goto = ["prefix+g", "alt+s"]
# Unbound: worktrees are created by alt+g / alt+p in the layout `hw` keeps (docs/shell.md).
new_worktree = ""
# j/k move the sidebar cursor in the prefix+w picker, as they do in the goto picker.
# Navigate mode does not tell shift+j from j, so the pane moves cannot keep a shifted j/k (herdr 0.9.5);
# panes stay on alt+j / alt+k.
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]
navigate_pane_up = ""
navigate_pane_down = ""

[[keys.command]]
key = "alt+plus"
type = "shell"
command = "herdr pane split --direction right --ratio 0.3 --focus"

[[keys.command]]
key = "alt+x"
type = "popup"
command = "~/.config/herdr/herdr-spaces.zsh"
description = "remove worktrees / close workspaces"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+n"
type = "popup"
command = "~/.config/herdr/herdr-repo.zsh"
description = "open a workspace on a repository"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+g"
type = "popup"
command = "~/.config/herdr/herdr-branch.zsh"
description = "open the worktree of a branch"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+p"
type = "popup"
command = "~/.config/herdr/herdr-pr.zsh"
description = "open the worktree of a pull request"
width = "90%"
height = "90%"

[[keys.command]]
key = "alt+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle the reviewr pane"

# ~/.config is a symlink to this repository, so `tv update-channels` and
# `tv migrate-config` would write into the checkout.
default_channel = "channels"

[ui]
layout = "landscape"

[ui.preview_panel]
size = 60

# Emacs editing keys as in .config/nvim, so they win over tv's panel toggles.
# The toggles avoid alt-, which herdr takes for pane focus, and f1-f3, which are
# channel shortcuts. An unknown action name here is ignored silently.
[keybindings]
ctrl-h = "delete_prev_char"
ctrl-b = "go_to_prev_char"
ctrl-f = "go_to_next_char"
ctrl-d = "scroll_preview_half_page_down"
ctrl-u = "scroll_preview_half_page_up"
ctrl-g = "toggle_help"
f4 = "cycle_previews"

# Replaces tv's default table rather than extending it.
[shell_integration.channel_triggers]
"dirs" = ["cd", "ls", "rmdir"]
"files" = ["cat", "less", "head", "tail", "bat", "cp", "mv", "rm", "touch", "chmod", "ln", "tar", "zip", "unzip", "nvim", "v"]
"env" = ["export", "unset"]
# Commands taking a local branch name: the channel strips `origin/`, which
# `git merge` / `git rebase` would need to keep.
"git-branch" = ["git checkout", "git switch", "git branch", "git br"]
"git-stage" = ["git add", "git restore"]
"git-log" = ["git log", "git show"]
"git-repos" = ["git clone"]

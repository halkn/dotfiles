# [dotfiles] symlinks ~/.config to this repository, so `tv update-channels` and
# `tv migrate-config` write into the checkout: use the channels shipped with the
# binary and keep custom ones under cable/ in git instead.

[ui]
layout = "landscape"

[ui.preview_panel]
size = 60

# Emacs-style editing while filtering, matching the insert-mode maps in
# .config/nvim: the cursor and deletion keys win over tv's panel toggles. The
# displaced toggles avoid alt-, which herdr claims for pane focus (alt+h/j/k/l)
# before tv sees it. An unknown action name here is ignored silently, so names
# are the ones in tv's actions reference; f1-f3 are channel shortcuts.
# Preview scrolling stays on PageUp / PageDown.
[keybindings]
ctrl-h = "delete_prev_char"
ctrl-d = "delete_next_char"
ctrl-b = "go_to_prev_char"
ctrl-f = "go_to_next_char"
ctrl-g = "toggle_help"
f4 = "cycle_previews"

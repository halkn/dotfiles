[metadata]
name = "git-stage"
description = "Stage or restore changed files"
requirements = ["git"]

[source]
# The built-in git-diff channel lists `git diff --name-only HEAD`, which leaves
# out untracked files; `git status` is what makes a new file stageable here.
command = "git status --porcelain | cut -c4-"

[preview]
command = "git diff HEAD --color=always -- '{}'"

[keybindings]
ctrl-s = "actions:stage"
ctrl-r = "actions:restore"

[actions.stage]
description = "Stage the selected files"
command = "git add -- {}"
mode = "fork"

[actions.restore]
description = "Restore the selected files"
command = "git restore -- {}"
mode = "fork"

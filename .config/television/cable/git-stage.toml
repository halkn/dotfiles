[metadata]
name = "git-stage"
description = "Stage or restore changed files"
requirements = ["git"]

[source]
# Not `git status --porcelain`, which quotes paths holding a space or a
# non-ASCII byte and renders a rename as `old -> new` - a redirect to the shell
# running the actions below. The built-in git-diff channel misses untracked.
command = "git -c core.quotePath=false diff --name-only HEAD 2>/dev/null; git -c core.quotePath=false ls-files --others --exclude-standard"

[preview]
command = "if git ls-files --error-unmatch -- '{}' >/dev/null 2>&1; then git diff HEAD --color=always -- '{}'; else git diff --no-index --color=always -- /dev/null '{}'; fi"

[keybindings]
ctrl-s = "actions:stage"
# Not ctrl-r: that reloads the source everywhere else, and this is not undoable.
f5 = "actions:restore"

[actions.stage]
description = "Stage the selected files"
command = "git add -- '{}'"
separator = "' '"
mode = "fork"

[actions.restore]
description = "Restore the selected files"
command = "git restore -- '{}'"
separator = "' '"
mode = "fork"

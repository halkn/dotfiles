[metadata]
name = "git-branch"
description = "Select a branch, most recently committed first"
requirements = ["git"]

[source]
# `%(refname:short)` renders the remote HEAD symref as a bare `origin`.
command = "git branch --all --sort=-committerdate --format='%(refname:short)' | grep -vx origin"
# Short name, so that `git switch <name>` tracks instead of detaching HEAD.
output = "{replace:s/^origin\\///}"

[preview]
command = "git log --oneline --graph --color=always '{}' -- | head -200"

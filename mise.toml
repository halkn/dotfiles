[settings.task]
# Installation goes through `mise bootstrap` alone, which orders packages before tools.
# Auto-installing before a task would unpack a zip on a fresh machine before unzip is there.
run_auto_install = false

[tools]
# Neovim LSP / formatter, only for the file types this repository owns.
"pipx:shuck-cli" = "latest"
stylua = "latest"

[tool_alias]
emmylua_ls = "github:EmmyLuaLs/emmylua-analyzer-rust"
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools.emmylua_ls]
version = "latest"
matching = "emmylua_ls"
rename_exe = "emmylua_ls"

[tools.emmylua_check]
version = "latest"
matching = "emmylua_check"
rename_exe = "emmylua_check"

# ── Setup（mise bootstrap） ──────────────────────────

# source is relative to the directory holding mise.toml; mode = "symlink" is the default.
[dotfiles]
"~/.config" = { source = ".config" }
"~/.zshenv" = { source = ".zshenv" }
"~/.claude/CLAUDE.md" = { source = "claude/CLAUDE.md" }
"~/.claude/settings.json" = { source = "claude/settings.json" }
"~/.claude/statusline-command.sh" = { source = "claude/statusline-command.sh" }
"~/.claude/file-suggestion.sh" = { source = "claude/file-suggestion.sh" }
"~/.claude/hooks/*" = { source = "claude/hooks/*" }

# apt entries apply on Linux and are skipped elsewhere. git and curl are already installed by
# the manual steps in README before the clone, but stay declared here because it is idempotent.
# macOS needs none of the rest: zsh ships with the OS, and the Claude Code sandbox uses
# Seatbelt rather than bubblewrap and socat.
[bootstrap.packages]
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:zsh" = "latest"
"apt:unzip" = "latest"
"apt:bubblewrap" = "latest"
"apt:socat" = "latest"

# /bin/zsh exists on both Ubuntu (via usrmerge) and macOS.
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.repos]
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.local/share/zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting" }

[tasks.setup]
description = "フルセットアップ（パッケージ索引更新 → mise bootstrap → Claude Code）"
dir = "{{config_root}}"
run = "mise bootstrap --yes --update"

# Runs as the last step of `mise bootstrap`, so it has to stay idempotent. The herdr plugin
# itself is fetched by herdr and gitignored, which is why it is declared here, not in [dotfiles].
[tasks.bootstrap]
description = "Claude Code と herdr プラグインをインストール（未導入時のみ）"
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash
# `herdr plugin list` exits 0 even when the plugin is missing (herdr 0.8.0), so check output.
if command -v herdr >/dev/null; then
  herdr plugin list --plugin persiyanov.reviewr 2>/dev/null | grep -q persiyanov.reviewr ||
    herdr plugin install --yes persiyanov/herdr-reviewr
fi
"""

# ── Maintenance ──────────────────────────────────────

[tasks.sync]
description = "dotfiles と lockfile 固定の mise ツールを同期"
dir = "{{config_root}}"
run = ["git pull --ff-only", "mise install"]

[tasks.update]
description = "mise 本体・ツール・lockfile・OS パッケージ・zsh プラグイン・Claude Code を更新"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise self-update --yes
mise upgrade
mise bootstrap packages upgrade
mise bootstrap repos update --yes
command -v claude >/dev/null && claude update || true
"""

# ── Quality ──────────────────────────────────────────

[tasks.lint]
description = "リポジトリ検証（整形チェックを含む）"
depends = ["fmt-check", "lint:zsh", "lint:shell", "lint:nvim"]
dir = "{{config_root}}"
run = "git diff --check"

[tasks.fmt]
description = "ファイル整形"
dir = "{{config_root}}"
run = ["mise fmt", "rumdl fmt .", "shuck format .", "stylua .config/nvim"]

[tasks.fmt-check]
description = "整形チェック（書き換えなし）"
dir = "{{config_root}}"
run = [
  "mise fmt --check",
  "rumdl check .",
  "shuck format --check .",
  "stylua --check .config/nvim",
]

# Kept apart from lint:shell to catch zsh-only syntax (glob qualifiers and the like) that the
# zsh dialect of `shuck check` does not fully parse. Untracked `*.local` files are excluded
# because they produce false positives.
[tasks."lint:zsh"]
hide = true
dir = "{{config_root}}"
run = """
#!/usr/bin/env zsh
# `zsh -n a b` parses only a and treats the rest as positional arguments, so pass one at a time.
set -uo pipefail
rc=0
for f in .zshenv .config/zsh/.zshenv .config/zsh/.zshrc .config/zsh/**/*.zsh(N); do
  zsh -n "$f" || rc=1
done
exit $rc
"""

# Given a directory, shuck also picks up extensionless files such as `.zshrc` (shuck 0.1.1).
[tasks."lint:shell"]
hide = true
dir = "{{config_root}}"
run = "shuck check ."

[tasks."lint:nvim"]
description = "Neovim Lua の診断と起動確認"
dir = "{{config_root}}"
run = [
  """
VIMRUNTIME="$(NVIM_LOG_FILE=/dev/null nvim --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME)' +q 2>/dev/null)" \\
  emmylua_check .config/nvim
""",
  "NVIM_LOG_FILE=/dev/null nvim --headless -i NONE '+quitall'",
]

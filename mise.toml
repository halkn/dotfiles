# Tools are declared only in the global config (.config/mise/config.toml); this file holds the
# machine setup and this repository's tasks.

# ── Setup（mise bootstrap） ──────────────────────────

# `~/.claude` cannot be linked as a whole directory because Claude Code writes its own state
# there, so the glob links each entry of `claude/` instead. `claude/**/*` cannot replace it:
# it matches both `hooks` and `hooks/*` and fails with a conflicting-declaration error.
# `~/.config` is linked per entry too, so that it stays a real directory (docs/claude-code.md).
[dotfiles]
"~/.config/*" = { source = ".config/*" }
"~/.zshenv" = { source = ".zshenv" }
"~/.claude/*" = { source = "claude/*" }
# Per entry, because ~/.local/bin (already on PATH via .config/zsh/.zshenv) holds other tools too.
"~/.local/bin/*" = { source = "bin/*" }

# git and curl are already installed by the manual steps in README before the clone, but stay
# declared here because it is idempotent.
# macOS needs none of the rest: zsh and unzip ship with the OS, and the Claude Code sandbox uses
# Seatbelt rather than bubblewrap and socat.
# The casks stay off Linux: under WSL the terminal and its font belong to the Windows host.
[bootstrap.packages]
"apt:git" = { os = "linux" }
"apt:curl" = { os = "linux" }
"apt:zsh" = { os = "linux" }
"apt:unzip" = { os = "linux" }
"apt:bubblewrap" = { os = "linux" }
"apt:socat" = { os = "linux" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:font-udev-gothic-nf" = { os = "macos" }

# /bin/zsh exists on both Ubuntu (via usrmerge) and macOS.
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.repos]
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.local/share/zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting" }

# Claude Code is in the mise registry, but `claude update` (run by `mise run update`) replaces it
# in place behind mise's back, so it stays on its own installer.
[bootstrap.hooks.final]
run = "command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash"

# herdr plugins have no declarative install; herdr itself is a tool, hence post-tools and `mise exec`.
# `plugin list --plugin` exits 0 for a missing plugin too (herdr 0.9.5), so the JSON is checked.
[bootstrap.hooks.post-tools]
run = "mise exec herdr jq -- sh -c 'herdr plugin list --plugin persiyanov.reviewr --json | jq -e \".result.plugins | length > 0\" >/dev/null || herdr plugin install persiyanov/herdr-reviewr --yes'"

# ── Maintenance ──────────────────────────────────────

# Full convergence, not just `mise install`: a pulled commit can change any declaration, and
# installing tools alone would leave the rest of the machine on the previous one. No `--update`,
# which would fast-forward [bootstrap.repos].
[tasks.sync]
description = "リポジトリの更新を取り込み、宣言状態へ収束"
run = ["git pull --ff-only", "mise bootstrap --yes"]

# ── Quality ──────────────────────────────────────────

[tasks.lint]
description = "リポジトリ検証（整形チェックを含む）"
depends = [
  "fmt-check",
  "lint:config",
  "lint:tasks",
  "lint:shell",
  "lint:actions",
  "lint:nvim",
  "test:scripts",
]
run = "git diff --check"

# `mise fmt` rewrites every config even when nothing changes, and the configs are not writable
# from the Claude Code sandbox (docs/claude-code.md), so it runs only when a change is needed.
[tasks.fmt]
description = "ファイル整形"
run = [
  "mise fmt --check >/dev/null 2>&1 || mise fmt",
  "rumdl fmt .",
  "shuck format .",
  "stylua .config/nvim",
]

[tasks.fmt-check]
description = "整形チェック（書き換えなし）"
run = [
  "mise fmt --check",
  "rumdl check .",
  "shuck format --check .",
  "stylua --check .config/nvim",
]

# A task file that lost its executable bit disappears from `mise tasks ls` without an error.
[tasks."lint:tasks"]
description = "mise タスク定義の検証"
hide = true
run = "mise tasks validate"

[tasks."lint:shell"]
description = "シェルスクリプトの静的検査"
hide = true
run = "shuck check ."

# shellcheck is on the ubuntu runner but not on macOS, so leaving it to PATH would make CI fail
# where the local lint passes. The run: steps are one-line commands; shell-syntax still parses them.
[tasks."lint:actions"]
description = "GitHub Actions workflow の静的検査"
hide = true
run = "jactionlint --shellcheck="

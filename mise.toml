[settings.task]
# Installation goes through `mise bootstrap` alone, which orders packages before tools.
# Auto-installing before a task would unpack a zip on a fresh machine before unzip is there.
run_auto_install = false

[tools]
# Lua toolchain, called only from this repository's `mise run` and from nvim opened inside it.
stylua = "latest"

[tool_alias]
emmylua_ls = "github:EmmyLuaLs/emmylua-analyzer-rust"
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools.emmylua_ls]
version = "latest"
matching = "emmylua_ls"
rename_exe = "emmylua_ls"

[tools.emmylua_check]
version = "latest"
matching = "emmylua_check"
rename_exe = "emmylua_check"

# ── Setup（mise bootstrap） ──────────────────────────

# source is relative to the directory holding mise.toml; mode = "symlink" is the default.
[dotfiles]
"~/.config" = { source = ".config" }
"~/.zshenv" = { source = ".zshenv" }
"~/.claude/CLAUDE.md" = { source = "claude/CLAUDE.md" }
"~/.claude/settings.json" = { source = "claude/settings.json" }
"~/.claude/statusline-command.sh" = { source = "claude/statusline-command.sh" }
"~/.claude/hooks/*" = { source = "claude/hooks/*" }

# apt entries apply on Linux and are skipped elsewhere. git and curl are already installed by
# the manual steps in README before the clone, but stay declared here because it is idempotent.
# macOS needs none of the rest: zsh ships with the OS, and the Claude Code sandbox uses
# Seatbelt rather than bubblewrap and socat.
[bootstrap.packages]
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:zsh" = "latest"
"apt:unzip" = "latest"
"apt:bubblewrap" = "latest"
"apt:socat" = "latest"

# /bin/zsh exists on both Ubuntu (via usrmerge) and macOS.
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.repos]
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.local/share/zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting" }

# `--update` refreshes the package manager metadata, which a fresh machine has never fetched;
# it also fast-forwards [bootstrap.repos], harmless on a first run because they are being cloned.
# `mise run sync` is the same convergence without either, for machines that are already set up.
[tasks.setup]
description = "初回セットアップ（パッケージ索引更新 → 宣言状態へ収束）"
dir = "{{config_root}}"
run = "mise bootstrap --yes --update"

# Runs as the last step of `mise bootstrap`, so it has to stay idempotent. The herdr plugin
# itself is fetched by herdr and gitignored, which is why it is declared here, not in [dotfiles].
# Hidden: this is a step of `mise bootstrap`, not an entry point to run on its own.
[tasks.bootstrap]
hide = true
description = "Claude Code と herdr プラグインをインストール（未導入時のみ）"
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash
# `herdr plugin list` exits 0 even when the plugin is missing (herdr 0.8.0), so check output.
# `--yes` has to follow the positional argument: despite the `[OPTIONS] <OWNER/REPO>` help text,
# herdr 0.8.0 rejects a leading flag with a usage error.
if command -v herdr >/dev/null; then
  herdr plugin list --plugin persiyanov.reviewr 2>/dev/null | grep -q persiyanov.reviewr ||
    herdr plugin install persiyanov/herdr-reviewr --yes
fi
"""

# ── Maintenance ──────────────────────────────────────

# Full convergence, not just `mise install`: a pulled commit can change any declaration
# ([dotfiles], [bootstrap.packages], [bootstrap.repos], [bootstrap.user]), and installing tools
# alone would leave the rest of the machine on the previous declaration. No `--update`, so
# versions only move where the lockfile moved.
[tasks.sync]
description = "リポジトリの更新を取り込み、宣言状態へ収束"
dir = "{{config_root}}"
run = ["git pull --ff-only", "mise bootstrap --yes"]

# No `set -e`: every step is independent, so one failure must not skip the rest. Failures are
# collected and surfaced in the exit code instead, and a component that is not installed is
# skipped rather than counted as a failure.
# `{% raw %}`: mise renders `run` through Tera, and bash's `${#arr[@]}` opens a Tera comment.
[tasks.update]
description = "mise 本体・ツール・lockfile・OS パッケージ・zsh プラグイン・Claude Code を更新"
dir = "{{config_root}}"
run = """
{% raw %}#!/usr/bin/env bash
set -uo pipefail

failed=()

# The machines this repository is deployed on: Apple Silicon macOS and WSL. Locking only these
# keeps the lockfiles reviewable, at the cost of a re-resolve on any other platform.
PLATFORMS="macos-arm64,linux-x64"

step() {
  local name=$1
  shift
  "$@" || failed+=("$name")
}

optional_step() {
  local name=$1
  shift
  if command -v "$1" >/dev/null; then
    step "$name" "$@"
  else
    echo "skip: $1 is not installed"
  fi
}

step "mise self-update" mise self-update --yes
step "mise upgrade" mise upgrade
# `mise upgrade` only writes lockfile entries for the platform it runs on, so the other
# platform's URLs and checksums would stay on the previous version. Both config roots are
# locked because each keeps its own lockfile.
step "lockfile platforms" mise lock --platform "$PLATFORMS"
step "lockfile platforms (global)" mise lock --global --platform "$PLATFORMS"
step "bootstrap packages" mise bootstrap packages upgrade
step "bootstrap repos" mise bootstrap repos update --yes
# herdr has no `plugin update`; reinstalling replaces the managed checkout and keeps plugin
# config and state (herdr 0.8.0). The herdr binary itself is a mise tool, so `mise upgrade`
# already covers it and `herdr update` must not be added here. `--yes` follows the positional
# argument because herdr 0.8.0 rejects a leading flag.
optional_step "herdr plugin" herdr plugin install persiyanov/herdr-reviewr --yes
optional_step "claude update" claude update

if ((${#failed[@]} > 0)); then
  printf 'failed: %s\\n' "${failed[@]}" >&2
  exit 1
fi
{% endraw %}"""

# ── Quality ──────────────────────────────────────────

[tasks.lint]
description = "リポジトリ検証（整形チェックを含む）"
depends = [
  "fmt-check",
  "lint:zsh",
  "lint:shell",
  "lint:nvim",
  "lint:rules",
  "test:zsh",
]
dir = "{{config_root}}"
run = "git diff --check"

[tasks.fmt]
description = "ファイル整形"
dir = "{{config_root}}"
run = ["mise fmt", "rumdl fmt .", "shuck format .", "stylua .config/nvim"]

[tasks.fmt-check]
description = "整形チェック（書き換えなし）"
dir = "{{config_root}}"
run = [
  "mise fmt --check",
  "rumdl check .",
  "shuck format --check .",
  "stylua --check .config/nvim",
]

# A rules file is loaded in full whenever its `paths:` match, so its length is a context cost
# paid on every matching session rather than a style preference.
[tasks."lint:rules"]
hide = true
dir = "{{config_root}}"
run = """
#!/usr/bin/env zsh
set -uo pipefail
rc=0
for f in .claude/rules/*.md(N); do
  n=$(wc -l < "$f")
  if ((n > 40)); then
    print "$f: $n lines exceeds the 40-line budget; move procedures and measurements to a skill" >&2
    rc=1
  fi
done
exit $rc
"""

# Kept apart from lint:shell to catch zsh-only syntax (glob qualifiers and the like) that the
# zsh dialect of `shuck check` does not fully parse. Untracked `*.local` files are excluded
# because they produce false positives.
[tasks."lint:zsh"]
hide = true
dir = "{{config_root}}"
run = """
#!/usr/bin/env zsh
# `zsh -n a b` parses only a and treats the rest as positional arguments, so pass one at a time.
set -uo pipefail
rc=0
for f in .zshenv .config/zsh/.zshenv .config/zsh/.zshrc .config/zsh/**/*.zsh(N); do
  zsh -n "$f" || rc=1
done
exit $rc
"""

[tasks."test:zsh"]
description = "zsh workflow のテスト"
dir = "{{config_root}}"
run = """
#!/usr/bin/env zsh
set -uo pipefail
rc=0
for f in .config/zsh/test/*_test.zsh; do
  zsh "$f" || rc=1
done
exit $rc
"""

# Given a directory, shuck also picks up extensionless files such as `.zshrc` (shuck 0.1.1).
[tasks."lint:shell"]
hide = true
dir = "{{config_root}}"
run = "shuck check ."

[tasks."lint:nvim"]
description = "Neovim Lua の診断と起動確認"
dir = "{{config_root}}"
run = [
  """
VIMRUNTIME="$(NVIM_LOG_FILE=/dev/null nvim --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME)' +q 2>/dev/null)" \\
  emmylua_check --warnings-as-errors .config/nvim
""",
  "NVIM_LOG_FILE=/dev/null nvim --headless -i NONE -c 'luafile .config/nvim/test/smoke.lua'",
]

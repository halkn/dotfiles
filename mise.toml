# The global config declares its tools without a lockfile; reproducibility is opted into here, for
# the toolchain `mise run lint` depends on. Apple Silicon macOS and WSL are the machines this
# repository is deployed on.
[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[settings.task]
# Installation goes through `mise bootstrap` alone, which orders packages before tools.
# Auto-installing before a task would unpack a zip on a fresh machine before unzip is there.
run_auto_install = false

[tools]
# Lua toolchain, called only from this repository's `mise run` and from nvim opened inside it.
stylua = "latest"

[tool_alias]
emmylua_ls = "github:EmmyLuaLs/emmylua-analyzer-rust"
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools.emmylua_ls]
version = "latest"
matching = "emmylua_ls"
rename_exe = "emmylua_ls"

[tools.emmylua_check]
version = "latest"
matching = "emmylua_check"
rename_exe = "emmylua_check"

# ── Setup（mise bootstrap） ──────────────────────────

# `~/.claude` cannot be linked as a whole directory because Claude Code writes its own state
# there, so the glob links each entry of `claude/` instead. `claude/**/*` cannot replace it:
# it matches both `hooks` and `hooks/*` and fails with a conflicting-declaration error.
[dotfiles]
"~/.config" = { source = ".config" }
"~/.zshenv" = { source = ".zshenv" }
"~/.claude/*" = { source = "claude/*" }

# git and curl are already installed by the manual steps in README before the clone, but stay
# declared here because it is idempotent.
# macOS needs none of the rest: zsh and unzip ship with the OS, and the Claude Code sandbox uses
# Seatbelt rather than bubblewrap and socat.
# The casks stay off Linux: under WSL the terminal and its font belong to the Windows host.
[bootstrap.packages]
"apt:git" = { os = "linux" }
"apt:curl" = { os = "linux" }
"apt:zsh" = { os = "linux" }
"apt:unzip" = { os = "linux" }
"apt:bubblewrap" = { os = "linux" }
"apt:socat" = { os = "linux" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:font-udev-gothic-nf" = { os = "macos" }

# /bin/zsh exists on both Ubuntu (via usrmerge) and macOS.
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.repos]
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.local/share/zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting" }

# Claude Code is in the mise registry, but it self-updates in place and would drift from the
# lockfile, so it stays on its own installer.
[bootstrap.hooks.final]
run = "command -v claude >/dev/null || curl -fsSL https://claude.ai/install.sh | bash"

# ── Maintenance ──────────────────────────────────────

# Full convergence, not just `mise install`: a pulled commit can change any declaration
# ([dotfiles], [bootstrap.packages], [bootstrap.repos], [bootstrap.user]), and installing tools
# alone would leave the rest of the machine on the previous declaration. No `--update`, which
# would fast-forward [bootstrap.repos]; moving versions belongs to `update` alone.
[tasks.sync]
description = "リポジトリの更新を取り込み、宣言状態へ収束"
run = ["git pull --ff-only", "mise bootstrap --yes"]

# ── Quality ──────────────────────────────────────────

[tasks.lint]
description = "リポジトリ検証（整形チェックを含む）"
depends = [
  "fmt-check",
  "lint:tasks",
  "lint:shell",
  "lint:nvim",
  "lint:skills",
  "test:zsh",
]
run = "git diff --check"

[tasks.fmt]
description = "ファイル整形"
run = ["mise fmt", "rumdl fmt .", "shuck format .", "stylua .config/nvim"]

[tasks.fmt-check]
description = "整形チェック（書き換えなし）"
run = [
  "mise fmt --check",
  "rumdl check .",
  "shuck format --check .",
  "stylua --check .config/nvim",
]

# A task file that lost its executable bit disappears from `mise tasks ls` without an error.
[tasks."lint:tasks"]
description = "mise タスク定義の検証"
hide = true
run = "mise tasks validate"

[tasks."lint:shell"]
description = "シェルスクリプトの静的検査"
hide = true
run = "shuck check ."

[tasks."lint:nvim"]
description = "Neovim Lua の診断と起動確認"
run = [
  """
VIMRUNTIME="$(NVIM_LOG_FILE=/dev/null nvim --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME)' +q 2>/dev/null)" \\
  emmylua_check --warnings-as-errors .config/nvim
""",
  "NVIM_LOG_FILE=/dev/null nvim --clean --headless --cmd 'set runtimepath^=.config/nvim' -l .config/nvim/test/keymaps.lua",
  "NVIM_LOG_FILE=/dev/null nvim --headless -i NONE -c 'luafile .config/nvim/test/smoke.lua'",
]

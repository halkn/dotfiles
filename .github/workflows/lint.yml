name: lint

on:
  pull_request:
  push:
    branches: [main]
  # Tools follow `latest`, so an upstream release can break lint with no change here. A weekly run
  # surfaces that on its own instead of on the next unrelated pull request.
  schedule:
    - cron: "17 0 * * 1"

# No secret is used, so a pull request from a fork runs with the same rights.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # A failed plugin fetch leaves the nvim smoke test waiting instead of exiting. A normal run
    # takes under 1 minute here and under 3 on macOS.
    timeout-minutes: 5
    env:
      # Stands in for the [dotfiles] links (~/.config/* -> .config/*), so mise's global config,
      # nvim and git read the same files as on a machine.
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
    steps:
      # Pinned by commit for the same reason .config/mise/config.toml holds back new releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run lint

  # A separate job rather than a matrix: a matrix renames the check to `lint (<os>)`, and the `ci`
  # ruleset requires the check named `lint`. Keep the steps in step with the job above.
  lint-macos:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zsh ships with macOS.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run lint
